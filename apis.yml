aid: hireart
name: HireArt
description: >-
  HireArt is a workforce management platform that helps enterprises source,
  employ, and manage their contingent workforce - contract workers, freelancers,
  and staffing vendors - through a single self-serve system. Its products span
  Employer of Record (EOR), on-demand sourcing and recruitment, a Vendor
  Management System (VMS), worker classification and compliance (1099 vs. W-2
  with indemnification), program management, and freelancer management. Customers
  include Toyota Research Institute, Zoox, Via, Scale AI, Dropbox, Meta Quest,
  Carta, and Rover. HireArt was surfaced as a portfolio company of a16z and added
  to the API Evangelist network; it does not publish a public developer API,
  developer portal, or API documentation at this time.
